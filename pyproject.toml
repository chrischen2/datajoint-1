[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dj-server"
version = "0.1.0"
description = "DataJoint Flask server for neuroscience experiment management"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Samarjit Kaushik", email = "samarjit@uw.edu" },
]
dependencies = [
  "datajoint>=2.0",
  "flask>=3.0.3",
  "flask-cors>=4.0.1",
  "h5py>=3.11.0",
  "matplotlib>=3.9.2",
  "numpy",
  "pymysql",
  "tqdm>=4.66.4",
]

[project.scripts]
dj-server = "dj_server.app:run_server"
